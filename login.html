<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Subway Alerts</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth">
    <div class="brand"><span class="mark" aria-hidden="true">SA</span>Subway Alerts</div>
    <div class="card">
      <h1>Welcome back</h1>
      <p class="lead">Log in to see delays on your line.</p>
      <div class="notice" id="notice" role="status">Account created. Please log in.</div>
      <div class="error" id="error" role="alert"></div>
      <form id="auth" data-mode="login" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password">
            <button type="button" class="toggle" aria-label="Show password">Show</button>
          </div>
        </div>
        <button class="btn primary full" type="submit">Log in</button>
      </form>
    </div>
    <p class="swap">New here? <a href="register.html">Create an account</a></p>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
