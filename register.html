<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Subway Alerts</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth">
    <div class="brand"><span class="mark" aria-hidden="true">SA</span>Subway Alerts</div>
    <div class="card">
      <h1>Create your account</h1>
      <p class="lead">Report delays and confirm what other riders see.</p>
      <div class="error" id="error" role="alert"></div>
      <form id="auth" data-mode="register" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
            <button type="button" class="toggle" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <div class="pw">
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Type it again">
            <button type="button" class="toggle" aria-label="Show password">Show</button>
          </div>
        </div>
        <button class="btn primary full" type="submit">Create account</button>
      </form>
    </div>
    <p class="swap">Already have an account? <a href="login.html">Log in</a></p>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
